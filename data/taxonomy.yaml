# QOC taxonomy — the backbone of the site.
#
# Every topic article, every classified arXiv paper, every research group and
# every open problem refers to topics by the `id`s defined here. Change ids
# with care: they become URLs (/topics/<id>/) and are stored in data files.
#
# Schema
#   families:        ordered list of top-level areas of the field
#     id, title, blurb
#   topics:          ordered list (order within a family = display order)
#     id             kebab-case, unique, stable
#     title          display name
#     family         id of the family it belongs to
#     short          one-sentence description (shown on cards and in the map)
#     aliases        other names / acronyms (search; later: arXiv matching)
#     related        ids of related topics (edges of the field map; undirected)
#
# STATUS: draft v0.1 (Phase 1) — to be reviewed before articles are written.

families:
  - id: foundations
    title: Foundations
    blurb: The mathematical framework — what can be controlled, how optimality is defined, and what the optimization problem looks like.
  - id: limits
    title: Speed limits & complexity
    blurb: Fundamental bounds on how fast and with how many resources a quantum system can be steered.
  - id: algorithms
    title: Numerical algorithms
    blurb: Optimization methods that compute control pulses — the computational workhorses of the field.
  - id: analytic
    title: Analytic & adiabatic design
    blurb: Pulse design from closed-form or physically motivated constructions rather than numerical search.
  - id: robust
    title: Robust control
    blurb: Making controls insensitive to noise, drifts, miscalibration and inhomogeneity.
  - id: learning
    title: Learning & closed-loop control
    blurb: Optimizing directly on the experiment, and using machine learning to find or adapt controls.
  - id: open-systems
    title: Open systems & feedback
    blurb: Control in the presence of an environment, of dissipation, and of measurement.
  - id: many-body
    title: Many-body & large systems
    blurb: Controlling systems whose state space grows exponentially, and the bridge to quantum algorithms.
  - id: tasks
    title: Control tasks
    blurb: What the controls are for — gates, states, sensing, thermodynamic cycles, error correction.
  - id: platforms
    title: Physical platforms
    blurb: How the ideas are realized in specific hardware, each with its own Hamiltonians and constraints.

topics:
  # ------------------------------------------------------------ foundations
  - id: controllability
    title: Quantum controllability
    family: foundations
    short: Which states or operations are reachable — answered by the dynamical Lie algebra generated by the drift and control Hamiltonians.
    aliases: [Lie algebra rank condition, reachability, dynamical Lie algebra, universality]
    related: [pmp, control-landscapes, gate-synthesis, geometric-control]

  - id: problem-formulation
    title: Problem formulation & figures of merit
    family: foundations
    short: How a control task is written as an optimization problem — dynamics, fidelity measures, penalties and constraints.
    aliases: [cost functional, fidelity, figure of merit, objective function, gate fidelity, state fidelity]
    related: [pmp, grape, krotov, pulse-parametrization]

  - id: pmp
    title: Pontryagin's maximum principle
    family: foundations
    short: Necessary conditions for optimality of a control, the starting point for both analytic solutions and gradient methods.
    aliases: [PMP, maximum principle, adjoint equations, costate]
    related: [geometric-control, krotov, grape, problem-formulation]

  - id: geometric-control
    title: Geometric & time-optimal control
    family: foundations
    short: Exact optimal solutions for low-dimensional systems using differential geometry, including minimum-time and singular controls.
    aliases: [time-optimal control, quantum brachistochrone, singular arcs, sub-Riemannian geometry, bang-bang control]
    related: [pmp, quantum-speed-limits, controllability, spins]

  - id: control-landscapes
    title: Control landscapes
    family: foundations
    short: The topology of the fidelity as a function of the control — why local optimizers so often find global optima, and when traps appear.
    aliases: [landscape theory, traps, critical points, kinematic landscape, saddles]
    related: [controllability, grape, quantum-speed-limits]

  # ------------------------------------------------------------ limits
  - id: quantum-speed-limits
    title: Quantum speed limits
    family: limits
    short: Lower bounds on the time needed to evolve between states, and their role as the minimal time reachable by optimal control.
    aliases: [QSL, Mandelstam-Tamm, Margolus-Levitin, minimal time, orthogonalization time]
    related: [geometric-control, control-complexity, control-landscapes, crab, open-system-control]

  - id: control-complexity
    title: Control complexity & resources
    family: limits
    short: How much information, bandwidth or how many control parameters are needed to reach a target — and how this scales with system size.
    aliases: [information-theoretic bound, control bandwidth, degrees of freedom, accessible states]
    related: [quantum-speed-limits, crab, many-body-control, pulse-parametrization]

  # ------------------------------------------------------------ algorithms
  - id: grape
    title: GRAPE
    family: algorithms
    short: Gradient Ascent Pulse Engineering — piecewise-constant controls updated with exact gradients of the fidelity.
    aliases: [gradient ascent pulse engineering, piecewise constant, L-BFGS-GRAPE]
    related: [krotov, second-order-methods, autodiff-control, problem-formulation, spins]

  - id: krotov
    title: Krotov's method
    family: algorithms
    short: A sequential, monotonically convergent update scheme with continuous-time controls and built-in update penalties.
    aliases: [Krotov, monotonic convergence, sequential update]
    related: [grape, pmp, open-system-control, molecules]

  - id: crab
    title: CRAB & dCRAB
    family: algorithms
    short: Chopped RAndom Basis — expand the control in a small, randomized basis and optimize the few coefficients, often gradient-free.
    aliases: [chopped random basis, dCRAB, dressed CRAB, RedCRAB]
    related: [gradient-free, pulse-parametrization, many-body-control, control-complexity, closed-loop]

  - id: goat
    title: GOAT
    family: algorithms
    short: Gradient Optimization of Analytic conTrols — exact gradients for arbitrary smooth, parametrized pulse shapes.
    aliases: [gradient optimization of analytic controls]
    related: [grape, pulse-parametrization, autodiff-control]

  - id: second-order-methods
    title: Quasi-Newton & second-order methods
    family: algorithms
    short: Using curvature information (BFGS, Newton) to accelerate convergence of gradient-based pulse optimization.
    aliases: [BFGS, L-BFGS, Newton method, Hessian]
    related: [grape, goat]

  - id: autodiff-control
    title: Automatic differentiation & differentiable programming
    family: algorithms
    short: Computing control gradients with machine-learning frameworks, enabling complex cost functions and models with little derivation effort.
    aliases: [automatic differentiation, autodiff, JAX, differentiable programming, backpropagation]
    related: [grape, goat, machine-learning-control, robust-optimal-control]

  - id: gradient-free
    title: Gradient-free & global optimizers
    family: algorithms
    short: Nelder–Mead, CMA-ES, evolutionary and swarm methods — useful when gradients are unavailable, noisy or misleading.
    aliases: [Nelder-Mead, CMA-ES, genetic algorithm, particle swarm, simplex, derivative-free]
    related: [crab, closed-loop, machine-learning-control]

  - id: pulse-parametrization
    title: Pulse parametrization & constraints
    family: algorithms
    short: Choosing how controls are represented, and enforcing experimental limits on amplitude, bandwidth, smoothness and transfer functions.
    aliases: [basis functions, bandwidth, transfer function, filtering, amplitude constraints, Slepian]
    related: [crab, goat, grape, control-complexity, problem-formulation]

  # ------------------------------------------------------------ analytic
  - id: shortcuts-to-adiabaticity
    title: Shortcuts to adiabaticity
    family: analytic
    short: Reach the result of a slow adiabatic process in finite time — counterdiabatic driving, invariant-based engineering, fast-forward.
    aliases: [STA, counterdiabatic driving, transitionless driving, invariant-based inverse engineering, fast-forward]
    related: [adiabatic-passage, quantum-speed-limits, cold-atoms, quantum-thermodynamics]

  - id: adiabatic-passage
    title: Adiabatic passage
    family: analytic
    short: Robust population transfer by slowly varying the Hamiltonian — rapid adiabatic passage, STIRAP and their variants.
    aliases: [STIRAP, RAP, rapid adiabatic passage, stimulated Raman adiabatic passage, Landau-Zener]
    related: [shortcuts-to-adiabaticity, robust-optimal-control, molecules, state-preparation]

  - id: drag
    title: DRAG & leakage suppression
    family: analytic
    short: Derivative Removal by Adiabatic Gate — analytic corrections that suppress leakage and phase errors in weakly anharmonic qubits.
    aliases: [derivative removal by adiabatic gate, leakage, weak anharmonicity]
    related: [superconducting, gate-synthesis, grape]

  # ------------------------------------------------------------ robust
  - id: robust-optimal-control
    title: Robust & ensemble optimal control
    family: robust
    short: Optimizing a pulse to perform well over a range of uncertain parameters — sampling, averaging and sensitivity-based approaches.
    aliases: [ensemble control, robust control, inhomogeneity, sensitivity, broadband pulses]
    related: [composite-pulses, filter-functions, autodiff-control, spins, adiabatic-passage]

  - id: composite-pulses
    title: Composite pulses
    family: robust
    short: Sequences of simple rotations whose systematic errors cancel to high order — BB1, CORPSE, SCROFULOUS and relatives.
    aliases: [BB1, CORPSE, SCROFULOUS, broadband pulses, narrowband pulses]
    related: [robust-optimal-control, dynamical-decoupling, trapped-ions, spins]

  - id: dynamical-decoupling
    title: Dynamical decoupling
    family: robust
    short: Pulse sequences that average away unwanted couplings to the environment — spin echo, CPMG, XY-n, UDD.
    aliases: [spin echo, CPMG, XY4, UDD, Uhrig, decoupling]
    related: [filter-functions, composite-pulses, quantum-sensing, open-system-control]

  - id: filter-functions
    title: Filter functions & noise-tailored control
    family: robust
    short: Frequency-domain description of how a control sequence filters noise, used to design noise-robust pulses and do noise spectroscopy.
    aliases: [filter function, noise spectroscopy, noise spectrum, 1/f noise]
    related: [dynamical-decoupling, robust-optimal-control, quantum-sensing]

  # ------------------------------------------------------------ learning
  - id: closed-loop
    title: Closed-loop & in-situ optimization
    family: learning
    short: Optimizing controls with fidelity estimates measured on the real device, sidestepping model errors.
    aliases: [closed-loop optimization, in situ, adaptive feedback control, ad-HOC, hybrid optimal control, calibration]
    related: [crab, gradient-free, model-learning, machine-learning-control]

  - id: machine-learning-control
    title: Reinforcement & machine learning for control
    family: learning
    short: Agents and neural networks that learn control policies or pulses, from simulation or directly from experimental data.
    aliases: [reinforcement learning, deep RL, neural network, policy gradient, Bayesian optimization]
    related: [closed-loop, autodiff-control, gradient-free, feedback-control]

  - id: model-learning
    title: System identification for control
    family: learning
    short: Learning the Hamiltonian, noise and hardware distortions well enough that model-based optimal pulses work on the device.
    aliases: [system identification, Hamiltonian learning, model calibration, characterization, digital twin]
    related: [closed-loop, pulse-parametrization, robust-optimal-control]

  # ------------------------------------------------------------ open systems
  - id: open-system-control
    title: Control of open quantum systems
    family: open-systems
    short: Optimal control of dissipative dynamics (Lindblad and non-Markovian), and fighting or exploiting decoherence.
    aliases: [Lindblad, master equation, non-Markovian, decoherence, dissipation]
    related: [reservoir-engineering, krotov, quantum-speed-limits, dynamical-decoupling, quantum-thermodynamics]

  - id: reservoir-engineering
    title: Reservoir engineering & dissipative preparation
    family: open-systems
    short: Designing the coupling to an environment so that dissipation itself drives the system to the desired state.
    aliases: [dissipative state preparation, engineered dissipation, reservoir engineering, autonomous stabilization]
    related: [open-system-control, state-preparation, error-correction]

  - id: feedback-control
    title: Measurement-based feedback
    family: open-systems
    short: Steering a system using real-time measurement records — quantum filtering, Markovian and Bayesian feedback.
    aliases: [quantum feedback, quantum filtering, weak measurement, continuous measurement, real-time feedback]
    related: [open-system-control, machine-learning-control, quantum-sensing, error-correction]

  # ------------------------------------------------------------ many-body
  - id: many-body-control
    title: Many-body optimal control
    family: many-body
    short: Optimal control of interacting many-particle systems, often combined with tensor-network simulations.
    aliases: [many-body, tensor network, MPS, tDMRG, spin chain, quantum simulation]
    related: [crab, control-complexity, neutral-atoms, cold-atoms, variational-algorithms]

  - id: variational-algorithms
    title: Variational algorithms & QAOA as control
    family: many-body
    short: Viewing variational quantum algorithms and QAOA as optimal control problems — and what each field can learn from the other.
    aliases: [QAOA, VQE, variational quantum algorithm, digital-analog, quantum annealing]
    related: [many-body-control, control-landscapes, gate-synthesis, state-preparation]

  # ------------------------------------------------------------ tasks
  - id: gate-synthesis
    title: Quantum gate synthesis
    family: tasks
    short: Designing pulses that implement target unitaries with high fidelity — single- and multi-qubit gates and leakage control.
    aliases: [gate optimization, unitary synthesis, entangling gates, two-qubit gates]
    related: [grape, drag, controllability, superconducting, trapped-ions]

  - id: state-preparation
    title: State preparation & transfer
    family: tasks
    short: Driving a system into a target state — from single-qubit transfers to entangled and many-body states.
    aliases: [state transfer, state-to-state, entangled state preparation, cooling]
    related: [many-body-control, adiabatic-passage, reservoir-engineering, variational-algorithms]

  - id: quantum-sensing
    title: Control for sensing & metrology
    family: tasks
    short: Using optimized controls to maximize sensitivity — e.g. quantum Fisher information — in the presence of noise.
    aliases: [quantum metrology, magnetometry, quantum Fisher information, Heisenberg limit, Ramsey]
    related: [dynamical-decoupling, filter-functions, feedback-control, spins]

  - id: quantum-thermodynamics
    title: Control in quantum thermodynamics
    family: tasks
    short: Optimal driving of quantum heat engines, refrigerators and batteries — power, efficiency and entropy production trade-offs.
    aliases: [quantum heat engine, quantum refrigerator, quantum battery, finite-time thermodynamics, work extraction]
    related: [shortcuts-to-adiabaticity, open-system-control]

  - id: error-correction
    title: Control for quantum error correction
    family: tasks
    short: Pulse design for QEC primitives — fast syndrome measurement, fault-tolerant operations and bosonic-code control.
    aliases: [quantum error correction, QEC, bosonic codes, cat code, GKP, fault tolerance]
    related: [gate-synthesis, feedback-control, reservoir-engineering, superconducting]

  # ------------------------------------------------------------ platforms
  - id: superconducting
    title: Superconducting circuits
    family: platforms
    short: Microwave control of transmons and other circuits — leakage, crosstalk, flux pulses and distortion are central concerns.
    aliases: [transmon, fluxonium, circuit QED, cQED, microwave pulses]
    related: [drag, gate-synthesis, error-correction, model-learning]

  - id: trapped-ions
    title: Trapped ions
    family: platforms
    short: Laser and microwave control of ions in electromagnetic traps — entangling gates via motional modes and shuttling.
    aliases: [ion trap, Molmer-Sorensen, motional modes, phonons, ion shuttling]
    related: [gate-synthesis, composite-pulses, robust-optimal-control]

  - id: neutral-atoms
    title: Neutral atoms & Rydberg arrays
    family: platforms
    short: Optical tweezer arrays with Rydberg interactions — optimal gates and many-body state preparation.
    aliases: [Rydberg, tweezer arrays, Rydberg blockade, neutral atom quantum computing]
    related: [many-body-control, gate-synthesis, cold-atoms]

  - id: cold-atoms
    title: Ultracold atoms & BECs
    family: platforms
    short: Controlling Bose–Einstein condensates and atoms in optical lattices — transport, splitting and many-body state preparation.
    aliases: [BEC, Bose-Einstein condensate, optical lattice, atom chip, atom interferometry]
    related: [many-body-control, shortcuts-to-adiabaticity, neutral-atoms, crab]

  - id: spins
    title: Spins — NMR, ESR & colour centres
    family: platforms
    short: Magnetic resonance and solid-state spins such as NV centres — the original home of GRAPE and robust pulse design.
    aliases: [NMR, ESR, EPR, MRI, NV center, nitrogen-vacancy, spin qubits, quantum dots]
    related: [grape, robust-optimal-control, composite-pulses, quantum-sensing]

  - id: molecules
    title: Molecules & chemical control
    family: platforms
    short: Laser control of molecular dynamics and reactions — one of the historical roots of quantum optimal control.
    aliases: [coherent control, femtosecond pulse shaping, chemical reactions, molecular dynamics, laser control]
    related: [krotov, adiabatic-passage, closed-loop]

  - id: photonics
    title: Photonic & optomechanical systems
    family: platforms
    short: Control of light, cavities and mechanical resonators — photon generation, routing and bosonic modes.
    aliases: [photonics, optomechanics, cavity QED, bosonic modes, single-photon sources]
    related: [error-correction, state-preparation, feedback-control]
