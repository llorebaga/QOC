# Results of the latest quality check of the paper archive (shown on the About page).
# Reproduce with tools/paper_quality.py; see data/quality/README.md for the method.
checked: 2026-10-12
archive_size: 3905

completeness:
  query_validation: >-
    All quant-ph papers of three full months (Mar 2021, Feb 2024, Sep 2026; 4,388 papers) were downloaded and
    the selection rule applied locally: the archive's API query missed none of the 172 matching papers.
  refetch: >-
    Five months, including the three with the lowest counts, were re-fetched independently: identical papers.

precision:
  estimate: 0.78
  ci95: 0.07
  n_labelled: 178
  note: >-
    133 papers from a stratified random sample (19-20 per year) plus 45 from the phrases added in October 2026,
    labelled by hand. No trend across years (70-89% per year, within sampling error).

recall:
  raw: 0.61
  corrected_low: 0.70
  corrected_high: 0.85
  reference: >-
    1,351 arXiv papers (2020-2026) citing core QOC works (GRAPE, CRAB, dCRAB, Krotov, GOAT, the QOC roadmap and
    major reviews); 61% are in the archive, 55-64% in every year. Many citing papers are not about control:
    in a labelled sample of the missed ones, 30% were genuine QOC papers, which puts the true recall at roughly
    70-85%.

share:
  note: >-
    QOC papers are 3.9-4.5% of all quant-ph submissions in every year since 2020: the field grows at the
    same pace as quantum physics as a whole.
