# Resources page: software, reading, glossary and timeline.
#
# Hand-written, but every bibliographic item is a key of data/references.yaml (generated by tools/refs.py) and every
# topic is an id of data/taxonomy.yaml; the build checks both. Software URLs are verified before they are listed
# (gh api repos/<owner>/<repo>, curl). Text fields accept Markdown, $math$ and [[topic-id]] links.

software:
  - group: Optimal-control frameworks
    items:
      - name: qutip-qoc
        url: https://github.com/qutip/qutip-qoc
        lang: Python
        what: GRAPE, CRAB, GOAT and JAX-based optimization of controls, built on QuTiP.
        topics: [grape, crab, goat, autodiff-control]
      - name: krotov
        url: https://github.com/qucontrol/krotov
        lang: Python
        what: Reference implementation of Krotov's method for closed and open systems, built on QuTiP.
        topics: [krotov, open-system-control]
        refs: [goerz2019krotov]
      - name: QuantumControl.jl
        url: https://github.com/JuliaQuantumControl/QuantumControl.jl
        lang: Julia
        what: >-
          Framework for quantum dynamics and control, with GRAPE.jl, Krotov.jl and QuantumPropagators.jl; supports
          semi-automatic differentiation of arbitrary figures of merit.
        topics: [grape, krotov, propagation-methods, autodiff-control]
        refs: [goerz2022semiad]
      - name: QuOCS
        url: https://github.com/Quantum-OCS/QuOCS
        lang: Python
        what: Quantum optimal control suite (dCRAB, GRAPE, automatic differentiation) designed to talk to experiments.
        topics: [crab, closed-loop, gradient-free]
        refs: [rossignolo2023quocs]
      - name: C3
        url: https://github.com/q-optimize/c3
        lang: Python
        what: Toolset that combines open-loop optimization, closed-loop calibration and model learning (TensorFlow).
        topics: [closed-loop, model-learning, goat]
        refs: [wittler2021c3]
      - name: qopt
        url: https://github.com/qutech/qopt
        lang: Python
        what: Qubit simulation and optimal control with realistic noise models, oriented towards experiments.
        topics: [grape, filter-functions, robust-optimal-control]
        refs: [teske2022qopt]
      - name: Piccolo.jl
        url: https://github.com/harmoniqs/Piccolo.jl
        lang: Julia
        what: Quantum optimal control by direct collocation, solved with an interior-point method.
        topics: [second-order-methods]
        refs: [trowbridge2023collocation]
      - name: Juqbox.jl
        url: https://github.com/LLNL/Juqbox.jl
        lang: Julia
        what: Optimal control of closed systems with B-spline envelopes and carrier waves.
        topics: [pulse-parametrization, gate-synthesis]
        refs: [petersson2022bsplines]
      - name: Quandary
        url: https://github.com/llnl/quandary
        lang: C++
        what: High-performance optimal control of open quantum systems (Lindblad), parallelized with MPI.
        topics: [open-system-control]
        refs: [gunther2021quandary]
      - name: Spinach
        url: https://spindynamics.org
        lang: MATLAB
        what: Spin-dynamics simulation for magnetic resonance, with GRAPE optimal control built in.
        topics: [spins, grape]
        refs: [hogben2011spinach]
      - name: QControlPolyOpt
        url: https://github.com/dibondar/QControlPolyOpt
        lang: Julia
        what: Global optimization of quantum control problems as polynomial optimization (QCPOP).
        topics: [polynomial-optimization]
        refs: [bondar2025qcpop]
      - name: ECD_control
        url: https://github.com/alec-eickbusch/ECD_control
        lang: Python
        what: Optimization of echoed conditional-displacement sequences for an oscillator coupled to a qubit.
        topics: [bosonic-control]
        refs: [eickbusch2022ecd]
      - name: Boulder Opal
        url: https://q-ctrl.com/boulder-opal
        lang: Python
        commercial: true
        what: Commercial software from Q-CTRL for autonomous calibration and control of quantum hardware (cloud service with a Python client).
        topics: [closed-loop, control-hardware]

  - group: Simulation and differentiable dynamics
    items:
      - name: QuTiP
        url: https://github.com/qutip/qutip
        lang: Python
        what: The Quantum Toolbox in Python — closed and open dynamics, the basis of many control packages.
        topics: [propagation-methods, open-system-control]
        refs: [johansson2012qutip, lambert2026qutip5]
      - name: QuantumToolbox.jl
        url: https://github.com/qutip/QuantumToolbox.jl
        lang: Julia
        what: QuTiP-style toolbox for quantum dynamics in Julia.
        topics: [propagation-methods]
      - name: dynamiqs
        url: https://github.com/dynamiqs/dynamiqs
        lang: Python
        what: GPU-accelerated, differentiable solvers for closed and open systems, built on JAX.
        topics: [autodiff-control, propagation-methods]
      - name: quantum-optimal-control
        url: https://github.com/SchusterLab/quantum-optimal-control
        lang: Python
        what: GRAPE with automatic differentiation on GPUs (TensorFlow); the code of the paper below, not actively maintained.
        topics: [autodiff-control, grape]
        refs: [leung2017gpu]
      - name: DYNAMO
        url: https://github.com/shaimach/Dynamo
        lang: MATLAB
        what: Unified framework for comparing and benchmarking gradient algorithms (GRAPE, Krotov and hybrids); last updated 2011.
        topics: [grape, krotov]
        refs: [machnes2011dynamo]

  - group: Pulse sequences and noise
    items:
      - name: Q-CTRL Open Controls
        url: https://github.com/qctrl/open-controls
        lang: Python
        what: Open library of dynamical-decoupling sequences and composite pulses.
        topics: [dynamical-decoupling, composite-pulses]
      - name: filter_functions
        url: https://github.com/qutech/filter_functions
        lang: Python
        what: Generalized filter functions and quantum processes of gate sequences under classical noise.
        topics: [filter-functions]
        refs: [hangleiter2021filter]

  - group: Platforms and hardware
    items:
      - name: Pulser
        url: https://github.com/pasqal-io/Pulser
        lang: Python
        what: Pulse-level and analog programming of neutral-atom arrays, with emulation.
        topics: [neutral-atoms, pulse-level-compilation]
        refs: [silverio2022pulser]
      - name: qutip-qip
        url: https://github.com/qutip/qutip-qip
        lang: Python
        what: Compiles circuits to pulses on simulated processors and simulates them with noise.
        topics: [pulse-level-compilation]
        refs: [li2022qutipqip]
      - name: PennyLane
        url: https://github.com/PennyLaneAI/pennylane
        lang: Python
        what: Differentiable quantum programming, including pulse programs with parametrized Hamiltonians.
        topics: [variational-algorithms, autodiff-control]
      - name: QICK
        url: https://github.com/openquantumhardware/qick
        lang: Python
        what: Firmware and software for RFSoC-based qubit control and readout.
        topics: [control-hardware]
      - name: Qibolab
        url: https://github.com/qiboteam/qibolab
        lang: Python
        what: Drivers and pulse execution for several control-electronics platforms.
        topics: [control-hardware]

  - group: General numerical tools
    items:
      - name: JAX
        url: https://github.com/jax-ml/jax
        lang: Python
        what: Automatic differentiation and GPU/TPU compilation; the engine of several packages above.
        topics: [autodiff-control]
      - name: SciPy optimize
        url: https://docs.scipy.org/doc/scipy/reference/optimize.html
        lang: Python
        what: L-BFGS-B, trust-region and other optimizers used by many Python control codes.
        topics: [second-order-methods]
      - name: NLopt
        url: https://github.com/stevengj/nlopt
        lang: C
        what: Library of local and global, gradient-based and derivative-free optimizers.
        topics: [gradient-free]
      - name: pycma
        url: https://github.com/CMA-ES/pycma
        lang: Python
        what: Reference implementation of the CMA-ES evolution strategy.
        topics: [gradient-free]
        refs: [hansen2001cmaes]
      - name: TSSOS
        url: https://github.com/wangjie212/TSSOS
        lang: Julia
        what: Sparse moment–SOS hierarchy for global polynomial optimization.
        topics: [polynomial-optimization]

reading:
  - group: Start here
    note: Reviews and tutorials that introduce the whole field.
    items:
      - key: glaser2015training
        note: The 2015 European roadmap — state of the art, goals and open challenges, across platforms.
      - key: koch2022roadmap
        note: The 2022 update of the roadmap, with a long list of open questions in controllability and control design.
      - key: ansel2024introduction
        note: A recent introduction to the theory and the experimental practice of optimal control.
      - key: brif2010control
        note: Past, present and future of controlling quantum phenomena, from chemistry to quantum information.
      - key: werschnik2007quantum
        note: A compact tutorial on quantum optimal control theory and its numerical methods.
      - key: dong2010survey
        note: A survey from the control-engineering side — controllability, feedback, robust and learning control.
      - key: giannelli2022tutorial
        note: Tutorial on optimal control and reinforcement learning methods for quantum technologies.
      - key: boscain2021pmp
        note: Pontryagin's maximum principle explained for quantum control, with worked examples.
  - group: Books
    items:
      - key: dalessandro2021introduction
        note: Mathematical introduction to quantum control — Lie-algebraic controllability, optimal control, dynamics.
      - key: wiseman2009book
        note: The standard text on quantum measurement and feedback control.
      - key: shapiro2011book
        note: Coherent control of molecular processes, from the founders of the interference approach.
      - key: agrachev2004geometric
        note: Geometric control theory — reachable sets, the maximum principle, sub-Riemannian problems.
      - key: nurdin2017linear
        note: Linear quantum systems and coherent feedback.
  - group: Reviews by topic
    items:
      - key: koch2016open
        note: Control of open quantum systems — tools, achievements and limitations.
      - key: chakrabarti2007landscapes
        note: Quantum control landscapes — critical points and what they mean for optimization.
      - key: muller2022decade
        note: Ten years of the chopped random basis (CRAB) method.
      - key: guery2019sta
        note: Shortcuts to adiabaticity — concepts, methods and applications.
      - key: vitanov2017stirap
        note: Stimulated Raman adiabatic passage and its many uses.
      - key: deffner2017review
        note: Quantum speed limits, from the uncertainty principle to optimal control.
      - key: lidar2014review
        note: Decoherence-free subspaces, noiseless subsystems and dynamical decoupling.
      - key: vandersypen2005nmr
        note: NMR techniques for quantum control and computation — where many control ideas were first tested.
      - key: koch2019rotation
        note: Quantum control of molecular rotation.
      - key: magann2021pulses
        note: Variational quantum algorithms seen as optimal control problems.
      - key: rembold2020nvsensing
        note: Optimal control for quantum sensing with NV centres.
  - group: Landmark papers
    note: A small selection; the timeline below gives more.
    items:
      - key: peirce1988optimal
        note: Optimal control theory formulated for quantum-mechanical systems.
      - key: judson1992teaching
        note: Closed-loop learning control — let the experiment optimize the pulse.
      - key: khaneja2001timeoptimal
        note: Time-optimal control of coupled spins by geometric methods.
      - key: khaneja2005grape
        note: GRAPE, the gradient algorithm used everywhere.
      - key: rabitz2004landscape
        note: Why optimal control is easy so often — trap-free landscapes.
      - key: caneva2009qsl
        note: Optimal control at the quantum speed limit.
      - key: doria2011crab
        note: CRAB — optimal control for many-body dynamics with few parameters.

glossary:
  - term: Average gate fidelity
    def: >-
      The fidelity between an implemented operation and a target gate, averaged uniformly over all pure input states.
      For a $d$-dimensional system it is an affine function of the entanglement fidelity, which makes it simple to
      compute (Nielsen's formula).
    topics: [problem-formulation, gate-synthesis]
  - term: Bilinear control system
    def: >-
      Dynamics of the form $\dot x = (A + \sum_k u_k(t) B_k)\,x$ — linear in the state and in the controls separately.
      The Schrödinger equation $i\dot\psi = (H_0 + \sum_k u_k(t) H_k)\psi$ is the standard example.
    topics: [controllability]
  - term: Closed-loop (learning) control
    def: >-
      Optimization in which every candidate control is tried on the experiment and the measured figure of merit is fed
      back to the optimizer; no accurate model is needed.
    topics: [closed-loop]
  - term: Coherent feedback
    def: >-
      Feedback in which the controller is itself a quantum system, connected to the plant without measurement — for
      example through optical fields.
    topics: [linear-quantum-systems, feedback-control]
  - term: Composite pulse
    def: >-
      A sequence of simple rotations whose errors cancel to some order, so that the whole sequence is robust to a
      systematic error (amplitude, detuning) that would spoil a single pulse.
    topics: [composite-pulses]
  - term: Control landscape
    def: >-
      The figure of merit viewed as a function of the controls. Its critical points — and whether it has traps —
      decide how hard an optimization is.
    topics: [control-landscapes]
  - term: Controllability
    def: >-
      The property that every target (state, or unitary) can be reached with admissible controls. For finite-dimensional
      closed systems it is decided by the Lie algebra generated by the drift and control Hamiltonians.
    topics: [controllability]
  - term: Counterdiabatic driving
    def: >-
      An added Hamiltonian that cancels the non-adiabatic transitions of a time-dependent Hamiltonian, so that the
      system follows its instantaneous eigenstates at any speed. Also called transitionless driving.
    topics: [shortcuts-to-adiabaticity]
  - term: CRAB
    def: >-
      Chopped RAndom Basis: the control is expanded in a few randomized basis functions, and the coefficients are
      optimized, often without gradients. dCRAB changes the basis during the optimization.
    topics: [crab]
  - term: DRAG
    def: >-
      Derivative Removal by Adiabatic Gate: adding a quadrature component proportional to the derivative of the pulse
      envelope suppresses leakage and phase errors in weakly anharmonic qubits such as transmons.
    topics: [drag]
  - term: Drift Hamiltonian
    def: >-
      The part of the Hamiltonian that cannot be switched off, $H_0$ in $H(t) = H_0 + \sum_k u_k(t)H_k$. A drift
      outside the control algebra sets intrinsic time scales and makes minimal times positive.
    topics: [controllability, quantum-speed-limits]
  - term: Dynamical decoupling
    def: >-
      Sequences of fast pulses that average the coupling between a system and its environment to zero, protecting
      the system from slow noise.
    topics: [dynamical-decoupling]
  - term: Ensemble (simultaneous) control
    def: >-
      One control that steers a whole family of systems, which differ in an unknown or inhomogeneous parameter, to their
      targets at the same time — the mathematical basis of robust pulses.
    topics: [robust-optimal-control]
  - term: Figure of merit
    def: >-
      The quantity an optimal control problem maximizes or minimizes — a fidelity, an expectation value, an error —
      often combined with costs on the control or the time.
    topics: [problem-formulation]
  - term: Filter function
    def: >-
      A function of frequency that measures how strongly a given control sequence lets noise at each frequency affect
      the system; the error is, to leading order, its overlap with the noise spectrum.
    topics: [filter-functions]
  - term: Floquet engineering
    def: >-
      Designing an effective time-independent Hamiltonian by driving a system periodically, using Floquet theory and
      high-frequency expansions.
    topics: [floquet-engineering]
  - term: GKSL (Lindblad) equation
    def: >-
      The general form of a Markovian master equation,
      $\dot\rho = -i[H,\rho] + \sum_k \big(V_k\rho V_k^\dagger - \tfrac12\{V_k^\dagger V_k,\rho\}\big)$, named after
      Gorini, Kossakowski, Sudarshan and Lindblad.
    topics: [open-system-control]
  - term: GOAT
    def: >-
      Gradient Optimization of Analytic conTrols: exact gradients for controls given by analytic functions, obtained
      by integrating the equations of motion of the propagator's derivatives.
    topics: [goat]
  - term: GRAPE
    def: >-
      GRadient Ascent Pulse Engineering: piecewise-constant controls, with the gradient of the figure of merit with
      respect to every time slice computed from one forward and one backward propagation.
    topics: [grape]
  - term: Krotov's method
    def: >-
      An iterative method that updates the whole control sequentially in time and is constructed to improve the
      figure of merit monotonically at every iteration.
    topics: [krotov]
  - term: Leakage
    def: >-
      Population leaving the computational subspace, for example to the third level of a transmon.
    topics: [drag, superconducting]
  - term: Lie algebra rank condition
    def: >-
      A finite-dimensional closed system is controllable on $SU(N)$ if the Lie algebra generated by $iH_0$ and the
      $iH_k$ is $\mathfrak{su}(N)$ (or $\mathfrak u(N)$).
    topics: [controllability]
  - term: Measurement-based feedback
    def: >-
      Control that uses the outcomes of measurements, typically continuous weak measurements processed by a quantum
      filter, to choose the next action.
    topics: [feedback-control]
  - term: Piecewise-constant control
    def: >-
      A control that is constant on each of a finite number of time slices — the standard parametrization of GRAPE
      and the natural output of arbitrary waveform generators.
    topics: [pulse-parametrization, grape]
  - term: Pontryagin's maximum principle
    def: >-
      Necessary conditions for optimality: an optimal control maximizes a pseudo-Hamiltonian built from the state and
      a costate that evolves backwards in time. It is the basis of time-optimal and geometric control.
    topics: [pmp]
  - term: Quantum speed limit
    def: >-
      A lower bound on the time needed for a quantum evolution or a control task. In optimal control it is often the
      minimal time below which a target cannot be reached with the available controls.
    topics: [quantum-speed-limits]
  - term: Reachable set
    def: >-
      All states (or operations) that can be reached from a given initial condition with admissible controls, in a
      fixed time or in any time.
    topics: [controllability]
  - term: Reservoir engineering
    def: >-
      Designing the coupling of a system to an environment so that dissipation itself drives the system to a desired
      state.
    topics: [reservoir-engineering]
  - term: Rotating-wave approximation
    def: >-
      Neglecting rapidly oscillating counter-rotating terms in a driven system, valid when the drive is weak and close
      to resonance.
    topics: [problem-formulation]
  - term: Shortcuts to adiabaticity
    def: >-
      Protocols that reach the result of a slow adiabatic process in a much shorter time — by counterdiabatic driving,
      invariant-based inverse engineering or related methods.
    topics: [shortcuts-to-adiabaticity]
  - term: STIRAP
    def: >-
      Stimulated Raman adiabatic passage: complete population transfer in a three-level system through a dark state,
      using a counter-intuitive order of two pulses.
    topics: [adiabatic-passage]
  - term: Time-optimal control
    def: >-
      Reaching a target in the shortest possible time with bounded controls or under fixed couplings; its solutions
      are often bang-bang or singular arcs of Pontryagin's principle.
    topics: [geometric-control, quantum-speed-limits]
  - term: Trap
    def: >-
      A control that is a local but not a global optimum of the figure of merit; a local optimizer started near it
      stops there.
    topics: [control-landscapes]

timeline:
  - year: 1950
    text: Hahn observes the spin echo — refocusing of dephasing by a pulse, the ancestor of dynamical decoupling.
    refs: [hahn1950echo]
  - year: 1954
    text: Carr and Purcell introduce trains of refocusing pulses; Meiboom and Gill's modification (1958) makes them robust.
    refs: [carr1954diffusion, meiboom1958modified]
  - year: 1979
    text: Levitt and Freeman use a composite pulse for robust population inversion in NMR.
    refs: [levitt1979inversion]
  - year: 1983
    text: Huang, Tarn and Clark study the controllability of quantum-mechanical systems with Lie-algebraic methods.
    refs: [huang1983controllability]
  - year: 1985
    text: Tannor and Rice propose controlling the selectivity of chemical reactions by timing pulse sequences.
    refs: [tannor1985control, tannor1986coherent]
  - year: 1986
    text: Brumer and Shapiro propose coherent control through the interference of excitation pathways.
    refs: [brumer1986control]
  - year: 1988
    text: Peirce, Dahleh and Rabitz formulate optimal control theory for quantum-mechanical systems.
    refs: [peirce1988optimal]
  - year: 1992
    text: Judson and Rabitz propose closed-loop learning control — "teaching lasers to control molecules".
    refs: [judson1992teaching]
  - year: 1998
    text: >-
      Feedback-optimized femtosecond pulses control a chemical reaction in the laboratory; in NMR, Glaser et al.
      determine the largest signal that unitary control of spin ensembles can achieve.
    refs: [assion1998chemical, glaser1998unitary]
  - year: 1999
    text: Viola, Knill and Lloyd formulate dynamical decoupling of open quantum systems.
    refs: [viola1999decoupling]
  - year: 2001
    text: Khaneja, Brockett and Glaser derive time-optimal controls for coupled spins with geometric methods.
    refs: [khaneja2001timeoptimal]
  - year: 2003
    text: Palao and Kosloff extend optimal control to unitary transformations — quantum gates.
    refs: [palao2003unitary]
  - year: 2004
    text: Rabitz, Hsieh and Rosenthal argue that quantum control landscapes are generically free of traps.
    refs: [rabitz2004landscape]
  - year: 2005
    text: Khaneja et al. introduce GRAPE for NMR pulse design.
    refs: [khaneja2005grape]
  - year: 2007
    text: Uhrig finds the optimal pulse timing for protecting a qubit from dephasing.
    refs: [uhrig2007keeping]
  - year: 2009
    text: >-
      DRAG pulses suppress leakage in superconducting qubits; optimal control is pushed to the quantum speed limit;
      transitionless driving is formulated.
    refs: [motzoi2009drag, caneva2009qsl, berry2009transitionless]
  - year: 2010
    text: Shortcuts to adiabaticity are introduced for fast frictionless cooling of atoms in traps.
    refs: [chen2010cooling]
  - year: 2011
    text: The CRAB method makes optimal control practical for many-body dynamics.
    refs: [doria2011crab]
  - year: 2015
    text: The first European roadmap for quantum optimal control is published.
    refs: [glaser2015training]
  - year: 2018
    text: GOAT gives exact gradients for analytic controls; reinforcement learning is applied to quantum control.
    refs: [machnes2018goat, bukov2018phases]
  - year: 2022
    text: The updated European roadmap for quantum optimal control in quantum technologies is published.
    refs: [koch2022roadmap]
  - year: 2025
    text: QCPOP finds globally optimal controls with polynomial optimization.
    refs: [bondar2025qcpop]
