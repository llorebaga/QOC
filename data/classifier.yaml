# Topic classifier for the paper tracker: which field-map topics a paper is about.
#
# For every topic (ids from data/taxonomy.yaml):
#   strong: characteristic phrases — enough when repeated, in the title, or supported by any other phrase
#   weak:   phrases that count only when repeated, in the title, or alongside other phrases
# Scoring (qocsite/classify.py): strong = 1.5 points, weak = 1 point per mention (at most 2 mentions per phrase),
# mentions in the title count double; a topic is assigned at 2 points or more, at most 4 topics per paper
# (the best supported ones).
#
# Matching: whole words, case-insensitive, spaces/hyphens interchangeable or absent, optional plural "s"/"es".
# A phrase without spaces and with two or more capitals (GRAPE, QAOA, NV, dCRAB) is matched case-sensitively.
# "re:" introduces a raw regular expression (case-insensitive), "RE:" a case-sensitive one.
#
# The rules are evaluated against hand-labelled papers (data/quality/topic-labels-*.csv):
#   python tools/paper_quality.py topics data/quality/topic-labels-test-2026-10.csv

controllability:
  strong: [controllability, dynamical Lie algebra, Lie algebra rank condition, Lie-algebraic, reachable set,
           reachability, universal control, Lie closure, subspace controllability, approximately controllable,
           completely controllable]
  weak: [universality, controllable, Lie algebra, accessibility]

