# Daily arXiv update: fetch new quantum-control papers, commit them to data/papers/.
# Everything that depends on the archive (home-page chart, paper tracker) is
# regenerated from these files at build time, so it updates automatically.
name: Update papers

on:
  schedule:
    - cron: "30 4 * * *"      # 04:30 UTC, after arXiv's daily announcement
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A 14-day window: arXiv indexes some submissions late, and re-fetching
      # also picks up new versions, DOIs and journal references.
      - name: Fetch recent papers
        run: python tools/fetch_arxiv.py --days 14

      - name: Check that the site still builds
        run: python build.py --base QOC

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "papers: daily arXiv update $(date -u +%F)"
            git push
          fi
