{#- Small line icons (24×24, stroke = currentColor). -#}
{% macro icon(name, cls='') -%}

{%- elif name == 'globe' -%}

{%- elif name == 'question' -%}

<path d="M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14"/><circle cx="6" cy="18" r="1.3"/>

<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>

<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- endif -%}
</svg>
{%- endmacro %}
