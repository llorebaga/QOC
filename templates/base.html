<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.full_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{ asset('img/favicon.svg') }}" type="image/svg+xml">
  {# Apply a saved theme before first paint to avoid a flash. #}
  <script>try{var t=localStorage.getItem("qoc-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{ asset('css/main.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="page-{{ page_id }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include "partials/header.html" %}
  <main id="main">
    {% block main %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  <script src="{{ asset('js/main.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
